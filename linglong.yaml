version: "1"

package:
  id: org.deepinenespanol.puzzle
  name: "Puzzle 15"
  version: 0.1.0.0
  kind: app
  description: |
    Sliding puzzle (15-Puzzle) game for Deepin desktop

command:
  - /opt/apps/org.deepinenespanol.puzzle/files/bin/puzzle

base: org.deepin.base/25.2.2
runtime: org.deepin.runtime.dtk/25.2.2

# Se empaqueta el .deb ya compilado (el CI lo deja en debs/).
# Se lee de /project/debs/ porque ll-builder vacia linglong/sources.
build: |
  dpkg-deb -X /project/debs/puzzle_*.deb $PREFIX/
  mv $PREFIX/usr/bin $PREFIX/bin
  mv $PREFIX/usr/share $PREFIX/share
  rm -rf $PREFIX/usr
  sed -i 's#^Exec=.*#Exec=/opt/apps/org.deepinenespanol.puzzle/files/bin/puzzle#' \
      $PREFIX/share/applications/org.deepinenespanol.puzzle.desktop

sources: []
